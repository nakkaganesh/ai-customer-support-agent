[project]
name = "ai-customer-support-agent"
version = "0.1.0"
description = "Production-grade AI customer support and knowledge agent built with LangChain"
readme = "README.md"
authors = [
    { name = "Ganesh" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=7.3.0",
    "pydantic>=2.13.5",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-customer-support-agent = "ai_customer_support_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
